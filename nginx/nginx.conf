server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API reverse proxy – keeps browser on same port, avoids CORS
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Webhook proxy — serves POST /webhook/telegram. Publicly reachable, so
    # TELEGRAM_WEBHOOK_SECRET should be set; without it the endpoint accepts any
    # forged update. (The Apple Pay webhook that also lived here was removed.)
    location /webhook/ {
        proxy_pass http://backend:3000/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback – all non-asset routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA files — must not fall through to index.html
    location = /manifest.webmanifest {
        # mime.types has no .webmanifest entry, so the type fell back to the default
        # octet-stream. add_header appends rather than replaces, so the response carried
        # two Content-Type headers and the browser acted on the octet-stream one.
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # How a running client discovers that a newer build is deployed, without going
    # through the service worker. Must never be cached or it defeats its own purpose.
    location = /version.json {
        # Content-Type comes from mime.types; setting it here too emitted it twice.
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # index.html carried no cache policy, so browsers applied heuristic caching and could
    # keep serving an old shell — with old asset hashes — long after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* workbox- {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json;
}
