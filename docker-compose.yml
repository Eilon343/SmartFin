name: smartfin

services:
  db:
    image: mysql:8.0
    container_name: smartfin_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: smartfin
    ports:
      - "3307:3306"
    volumes:
      - smartfin_mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smartfin-network
    mem_limit: 1g
    command:
      - --innodb-buffer-pool-size=256M
      - --innodb-redo-log-capacity=128M
      - --max-connections=50
      - --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot:
    build:
      context: ./bot
    container_name: smartfin_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
    networks:
      - smartfin-network
    mem_limit: 256m

  backend:
    build:
      context: ./backend
    container_name: smartfin_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - PORT=3000
    networks:
      - smartfin-network
    mem_limit: 1g
    # Chromium's zygote and crashpad children are re-parented to PID 1 when a scrape
    # ends. Node is PID 1 here and never reaps them, so every bank sync left ~4 zombie
    # processes behind until the container ran out of PIDs. `init` runs tini as PID 1,
    # which reaps orphans properly.
    init: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: smartfin_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"
    networks:
      - smartfin-network
    mem_limit: 64m

networks:
  smartfin-network:
    driver: bridge

volumes:
  smartfin_mysql_data:
    external: true
    name: smartfin_smartfin_mysql_data
